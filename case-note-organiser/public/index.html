<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Note Organiser</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Case Note Organiser</h1>
        </header>

        <main>
            <!-- Add Case Form -->
            <section class="form-section">
                <h2>Add New Case</h2>
                <form id="caseForm">
                    <div class="form-group">
                        <label for="caseReference">Case Reference:</label>
                        <input type="text" id="caseReference" required>
                    </div>
                    <div class="form-group">
                        <label for="memberName">Member Name:</label>
                        <input type="text" id="memberName" required>
                    </div>
                    <div class="form-group">
                        <label for="note">Note:</label>
                        <textarea id="note" rows="4" required></textarea>
                    </div>
                    <button type="submit">Add Case</button>
                </form>
            </section>

            <!-- Search Section -->
            <section class="search-section">
                <h2>Search Cases</h2>
                <div class="search-controls">
                    <input type="text" id="searchInput" placeholder="Search by case reference or member name...">
                    <button id="searchButton">Search</button>
                    <button id="clearSearch">Clear</button>
                </div>
            </section>

            <!-- Cases List -->
            <section class="cases-section">
                <h2>All Cases</h2>
                <div id="casesList" class="cases-list"></div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
